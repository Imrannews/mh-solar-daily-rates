<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MH Solar Admin</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body"><header class="topbar"><div class="wrap nav"><a class="brand" href="/"><span class="sun">☀</span><span>MH SOLAR <b>ADMIN</b></span></a><a href="/" class="admin-link">← Public Site</a></div></header>
<main class="wrap admin-main"><div id="loginPanel" class="panel auth"><div class="eyebrow">SECURE ACCESS</div><h1>Rate Management</h1><p>Sign in to add, edit and remove daily rates.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="btn primary">Sign in</button><p id="loginError" class="error"></p></div>
<div id="adminPanel" hidden><div class="admin-head"><div><span class="eyebrow">CONTROL ROOM</span><h1>Daily Rate Manager</h1></div><div><button id="seedBtn" class="btn ghost">Import starter rates</button><button id="logoutBtn" class="btn dark">Logout</button></div></div>
<form id="rateForm" class="panel form-grid"><input id="rateId" type="hidden"><label>Brand<input id="brand" required></label><label>Model / Description<input id="model" required></label><label>Watt / Size<input id="watt" type="number" required></label><label>Price (PKR)<input id="price" type="number" required></label><label>Category<select id="category"><option>Solar Panel</option><option>Inverter</option><option>Battery</option><option>Accessory</option></select></label><label>Status<select id="status"><option>In Stock</option><option>Out of Stock</option><option>Coming Soon</option></select></label><label class="check"><input id="offer" type="checkbox"> Special offer</label><div><button class="btn primary" type="submit">Save Rate</button><button id="cancelBtn" class="btn ghost" type="button">Cancel</button></div></form>
<div class="panel"><div class="table-head"><h2>All Rates</h2><input id="adminSearch" type="search" placeholder="Search…"></div><div id="adminList"></div></div></div></main><script type="module" src="/admin.js"></script></body></html>
